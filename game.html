<script>
// ══════════════════════════════════════════
// FIX: parser de URL que soporta flags sin valor (?host)
// El original sólo manejaba key=value, nunca detectaba ?host
// ══════════════════════════════════════════
var urlData = {};
try {
  var search = location.search.slice(1); // quitar el ?
  if (search) {
    search.split('&').forEach(function(part) {
      var idx = part.indexOf('=');
      if (idx === -1) {
        // flag sin valor: "host", "debug", etc.
        urlData[part] = true;
      } else {
        urlData[part.slice(0, idx)] = decodeURIComponent(part.slice(idx + 1));
      }
    });
  }
} catch(e) {}
</script>

<canvas id="c" style="display: none;"></canvas>

<div id="menu">
  <br>
  <div id="host" style="display: none;">
    <div id="gameDetails">
      <div id="gameCode">Code: <b id="roomCode">fetching</b><span id="incoming"></span></div>
      <a id="copyLink" href="#" onclick="(function(){
        navigator.clipboard.writeText(`https://aeolus-1.github.io/picoParkClone/game.html?join=${hostConnection.joinConn.selfId}`);
        return false;
      })();return false;">[Copy Link]</a>

    <div id="memberList" style="border: solid black 1px; width:200px">
      <h2>Members:</h2>

      <div>Host<br></div>
    </div>
    <button onClick="(function(){
      mainGame.playerhandler.addPlayer({
        controls:['a','d','w','s'],
        keys:keys,
        color:mainGame.fetchColor(),
      })
      addPlayerToMenu('Player2')
      return false;
    })();return false;">Add local co-op Player</button>
    <hr>
    <button onClick="(function(){
      startGame()
      hostConnection.broadcast(JSON.stringify({ startGame:true }))
      return false;
    })();return false;">Start Game</button>
  </div>

  <div id="join" style="display: none;">
    Waiting for host to start (maybe idk really)
  </div>
</div>

<script>
window.localfile = location.protocol == "file:"

function initGame() {
  window.mainGame = new Game()
  var player1 = mainGame.playerhandler.addPlayer({
    controls: ["arrowleft","arrowright","arrowup","arrowdown"],
    keys: keys,
  })
  window.hostConnection; window.clientConnection

  if (urlData.host)  { hostConnection = new Host(mainGame); hostConnection.init() }
  if (urlData.join)  { clientConnection = new Client(mainGame, player1); clientConnection.init(urlData.join); document.getElementById("restartLevel").style.display = "none" }
  if (!urlData.host && !urlData.join) startGame()

  setInterval(() => {
    if (window.hostConnection)   hostConnection.updateClients()
    if (window.clientConnection) clientConnection.updateHost()
  }, 10);

  setInterval(() => {
    mainGame.players.forEach((e) => { if (!e.onlinePlayer) e.updateKeys(keys) })
  }, 5);
}

function startMainGame() {
  mainGame.testInit()
  mainGame.initRender()
}

window.onload = () => {
  _loadFont("squareforced")

  if (urlData.host)      document.getElementById("host").style.display = ""
  else if (urlData.join) document.getElementById("join").style.display = ""

  initGame()

  let tempLevel = localStorage.getItem("tempLevel")
  if (tempLevel != null) {
    let levelString = `({${atob(tempLevel)}})`
    document.getElementById("gameCode").innerHTML = "-- temp level loaded --"
    document.getElementById("title").textContent  = "temp-level"
    document.getElementById("copyLink").style.display = "none"
    levels.tempLevel = eval(levelString)["tempName"]
    mainGame.runTemp = true
    localStorage.removeItem("tempLevel")
  }

  // ══════════════════════════════════════════════════════════════
  // NOTIFICAR AL PARENT (index.html) CUANDO PEERJS TENGA EL ID
  //
  // PeerJS asigna el ID de forma asíncrona. Lo detectamos
  // vigilando el elemento #roomCode hasta que deje de decir "fetching".
  // Luego enviamos postMessage al parent para que aparezca en la
  // sala de espera de index.html.
  // ══════════════════════════════════════════════════════════════
  if (urlData.host) {
    var peerIdSent  = false;
    var retryCount  = 0;
    var maxRetries  = 100; // 100 × 300ms = 30 segundos máximo

    var peerIdInterval = setInterval(function() {
      retryCount++;
      if (retryCount > maxRetries) {
        clearInterval(peerIdInterval);
        return;
      }

      var codeEl = document.getElementById('roomCode');
      if (!codeEl) return;

      var text = codeEl.textContent.trim();
      // El elemento empieza con "fetching", cuando PeerJS asigna el ID cambia
      if (text && text !== 'fetching' && text !== '' && !peerIdSent) {
        peerIdSent = true;
        clearInterval(peerIdInterval);

        var msg = { type: 'roomCode', code: text };

        // Notificar al parent (si estamos dentro de un iframe en index.html)
        try { window.parent.postMessage(msg, '*'); } catch(e) {}
        // Notificar al top también por si acaso
        try { if (window.top !== window.parent) window.top.postMessage(msg, '*'); } catch(e) {}
        // Notificar al opener (si se abrió como ventana nueva)
        try { if (window.opener) window.opener.postMessage(msg, '*'); } catch(e) {}
      }
    }, 300);

    // Observar cambios en #memberlist para notificar jugadores conectados
    var memberObserver = null;
    var waitMemberList = setInterval(function() {
      var ml = document.getElementById('memberlist');
      if (ml) {
        clearInterval(waitMemberList);
        memberObserver = new MutationObserver(function() {
          var count = (ml.children ? ml.children.length : 0) + 1; // +1 por el host
          var msg = { type: 'playerJoined', count: count };
          try { window.parent.postMessage(msg, '*'); } catch(e) {}
          try { if (window.top !== window.parent) window.top.postMessage(msg, '*'); } catch(e) {}
        });
        memberObserver.observe(ml, { childList: true, subtree: true });
      }
    }, 500);
  }
}

function setLevel(lvl) {
  mainGame.renderer.levelTransistion(lvl)
  if (window.hostConnection) {
    hostConnection.broadcast(JSON.stringify({ setLevel: lvl }))
  }
}
</script>

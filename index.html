<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="utf-8">
  <title>Pico Park</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: none;
      font-family: 'Press Start 2P', monospace;
    }
    #lobby {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      gap: 20px; padding: 20px;
    }
    #lobby h1 {
      font-size: clamp(10px, 4vw, 18px);
      color: #e94560;
      text-shadow: 0 0 20px #e94560, 2px 2px 0 #7a0000;
      text-align: center; line-height: 1.8; letter-spacing: 2px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    #tg-user-banner {
      font-size: clamp(7px, 2.5vw, 11px); color: #a8dadc;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(168,218,220,0.3);
      border-radius: 8px; padding: 8px 16px; text-align: center;
    }
    .lobby-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 2.8vw, 12px);
      color: #fff; background: #e94560; border: none; border-radius: 6px;
      padding: 14px 24px; cursor: pointer; width: 100%; max-width: 320px;
      text-align: center; box-shadow: 0 4px 0 #7a0000;
      transition: transform 0.08s, box-shadow 0.08s;
      -webkit-tap-highlight-color: transparent;
    }
    .lobby-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a0000; }
    .lobby-btn.secondary { background: #0f3460; box-shadow: 0 4px 0 #061a33; }
    .lobby-btn.secondary:active { box-shadow: 0 1px 0 #061a33; }
    .input-group { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
    .input-group label { font-size: clamp(7px, 2.2vw, 9px); color: #a8dadc; }
    .input-group input {
      font-family: 'Press Start 2P', monospace; font-size: clamp(8px, 2.5vw, 10px);
      background: rgba(255,255,255,0.08); border: 2px solid rgba(168,218,220,0.4);
      border-radius: 6px; color: #fff; padding: 12px 10px; width: 100%; outline: none;
    }
    .input-group input:focus { border-color: #e94560; }
    .divider { font-size: clamp(7px, 2vw, 9px); color: rgba(255,255,255,0.3); text-align: center; }
    #join-section { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 320px; }
    #error-msg { font-size: 9px; color: #ff6b6b; text-align: center; display: none; }
  </style>
</head>
<body>
<div id="lobby">
  <h1>🐱 PICO PARK<br>CLONE</h1>
  <div id="tg-user-banner">👤 <span id="tg-username">Player</span></div>

  <button class="lobby-btn" onclick="hostGame()">🎮 HOST GAME</button>

  <div class="divider">── OR ──</div>

  <div id="join-section">
    <div class="input-group">
      <label>ROOM CODE (4 letters)</label>
      <!-- El host genera una palabra de 4 letras ej: CAKE -->
      <input type="text" id="room-code" placeholder="CAKE" maxlength="10"
             style="text-transform:uppercase" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div id="error-msg">Please enter the room code</div>
    <button class="lobby-btn secondary" onclick="joinGame()">🔗 JOIN ROOM</button>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const tgUser = tg?.initDataUnsafe?.user;
  const username = tgUser?.username
    ? '@' + tgUser.username
    : (tgUser?.first_name || 'Player');
  document.getElementById('tg-username').textContent = username;

  // Guardar username para que game.html lo use
  localStorage.setItem('tg_username', username);

  function hostGame() {
    // Redirige directo a game.html con ?host=true (igual que el sistema original)
    window.location.href = 'game.html?host=true';
  }

  function joinGame() {
    const code = document.getElementById('room-code').value.trim().toUpperCase();
    if (!code) {
      document.getElementById('error-msg').style.display = 'block';
      return;
    }
    // Redirige con ?join=CODE (igual que el sistema original)
    window.location.href = 'game.html?join=' + encodeURIComponent(code);
  }

  // Enter en el input = join
  document.getElementById('room-code').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') joinGame();
  });
</script>
</body>
</html>

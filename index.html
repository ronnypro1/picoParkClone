<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="utf-8">
  <title>Pico Park</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: none;
      font-family: 'Press Start 2P', monospace;
    }

    /* ══════════════════════════════════════════
       LOBBY SCREEN
    ══════════════════════════════════════════ */
    #lobby {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 100;
      gap: 20px;
      padding: 20px;
    }

    #lobby h1 {
      font-size: clamp(10px, 4vw, 18px);
      color: #e94560;
      text-shadow: 0 0 20px #e94560, 2px 2px 0 #7a0000;
      text-align: center;
      line-height: 1.8;
      letter-spacing: 2px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    #tg-user-banner {
      font-size: clamp(7px, 2.5vw, 11px);
      color: #a8dadc;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(168,218,220,0.3);
      border-radius: 8px;
      padding: 8px 16px;
      text-align: center;
    }

    .lobby-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 2.8vw, 12px);
      color: #fff;
      background: #e94560;
      border: none;
      border-radius: 6px;
      padding: 14px 24px;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 4px 0 #7a0000;
      transition: transform 0.08s, box-shadow 0.08s;
      -webkit-tap-highlight-color: transparent;
    }
    .lobby-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #7a0000;
    }
    .lobby-btn.secondary {
      background: #0f3460;
      box-shadow: 0 4px 0 #061a33;
    }
    .lobby-btn.secondary:active {
      box-shadow: 0 1px 0 #061a33;
    }

    .input-group {
      display: flex; flex-direction: column;
      gap: 8px; width: 100%; max-width: 320px;
    }
    .input-group label {
      font-size: clamp(7px, 2.2vw, 9px);
      color: #a8dadc;
    }
    .input-group input {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 2.5vw, 10px);
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(168,218,220,0.4);
      border-radius: 6px;
      color: #fff;
      padding: 12px 10px;
      width: 100%;
      outline: none;
    }
    .input-group input:focus {
      border-color: #e94560;
    }

    .divider {
      font-size: clamp(7px, 2vw, 9px);
      color: rgba(255,255,255,0.3);
      text-align: center;
    }

    #join-section {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      width: 100%; max-width: 320px;
    }

    /* ══════════════════════════════════════════
       GAME WRAPPER
    ══════════════════════════════════════════ */
    #game-wrapper {
      position: fixed; inset: 0;
      display: none; /* oculto hasta que empiece el juego */
    }

    /* ── PORTRAIT ── */
    @media (orientation: portrait) {
      #game-wrapper {
        flex-direction: column;
        background: #111;
      }
      #canvas-area {
        flex: 1;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      #mobile-controls {
        height: 170px; flex-shrink: 0;
        display: flex; flex-direction: row;
        align-items: center; justify-content: space-between;
        padding: 10px 24px; gap: 12px;
        background: rgba(0,0,0,0.8);
        border-top: 1px solid rgba(233,69,96,0.3);
      }
      #controls-left, #controls-right {
        display: flex; align-items: center; justify-content: center;
      }
    }

    /* ── LANDSCAPE ── */
    @media (orientation: landscape) {
      #game-wrapper {
        flex-direction: row;
        background: #111;
      }
      #canvas-area {
        flex: 1;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      #mobile-controls { display: contents; }
      #controls-left {
        width: 150px; flex-shrink: 0; order: -1;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.8);
        border-right: 1px solid rgba(233,69,96,0.3);
      }
      #controls-right {
        width: 150px; flex-shrink: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px;
        background: rgba(0,0,0,0.8);
        border-left: 1px solid rgba(233,69,96,0.3);
      }
    }

    /* ── IFRAME del juego ── */
    #game-frame {
      width: 100%; height: 100%;
      border: none;
      display: block;
    }

    /* ══════════════════════════════════════════
       CONTROLES (igual que syobon)
    ══════════════════════════════════════════ */
    .dpad {
      position: relative;
      width: 130px; height: 130px;
      flex-shrink: 0;
    }
    .btn-d {
      position: absolute;
      width: 44px; height: 44px;
      background: rgba(233,69,96,0.2);
      border: 2px solid rgba(233,69,96,0.6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s;
      user-select: none;
    }
    .btn-d:active, .btn-d.pressed {
      background: rgba(233,69,96,0.7);
    }
    .btn-left  { left: 0;    top: 43px; }
    .btn-right { left: 86px; top: 43px; }
    .btn-up    { left: 43px; top: 0; }
    .btn-down  { left: 43px; top: 86px; }

    .action-btns {
      display: flex; gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-action {
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold; color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
      user-select: none;
      transition: background 0.08s;
      font-family: 'Press Start 2P', monospace;
    }
    .btn-action:active, .btn-action.pressed {
      filter: brightness(1.5);
    }
    /* Jump = Space en Pico Park */
    .btn-jump  { background: rgba(233,69,96,0.55); font-size: 20px; }
    /* Enter = interactuar / confirmar */
    .btn-enter { background: rgba(0,180,100,0.55); font-size: 8px; }
    /* E = acción especial (agarrar llave, etc.) */
    .btn-action-e { background: rgba(50,120,255,0.55); font-size: 8px; }

    /* ══════════════════════════════════════════
       NOTIFICACIÓN de sala
    ══════════════════════════════════════════ */
    #room-toast {
      display: none;
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(233,69,96,0.9);
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      z-index: 200;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<!-- ══ LOBBY ══ -->
<div id="lobby">
  <h1>🐱 PICO PARK<br>CLONE</h1>

  <div id="tg-user-banner">👤 <span id="tg-username">Player</span></div>

  <!-- Host -->
  <button class="lobby-btn" id="btn-host" onclick="hostGame()">🎮 HOST GAME</button>

  <div class="divider">── OR ──</div>

  <!-- Join -->
  <div id="join-section">
    <div class="input-group">
      <label>ROOM CODE</label>
      <input type="text" id="room-code" placeholder="ABC123" maxlength="8"
             style="text-transform:uppercase" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <button class="lobby-btn secondary" onclick="joinGame()">🔗 JOIN ROOM</button>
  </div>
</div>

<!-- ══ ROOM CODE TOAST ══ -->
<div id="room-toast" id="room-toast"></div>

<!-- ══ JUEGO ══ -->
<div id="game-wrapper">
  <div id="canvas-area">
    <iframe id="game-frame" src="" allow="autoplay" allowfullscreen></iframe>
  </div>

  <div id="mobile-controls">

    <!-- D-PAD izquierda -->
    <div id="controls-left">
      <div class="dpad">
        <div class="btn-d btn-up"    data-key="ArrowUp"    data-code="38">↑</div>
        <div class="btn-d btn-left"  data-key="ArrowLeft"  data-code="37">←</div>
        <div class="btn-d btn-right" data-key="ArrowRight" data-code="39">→</div>
        <div class="btn-d btn-down"  data-key="ArrowDown"  data-code="40">↓</div>
      </div>
    </div>

    <!-- Botones derecha -->
    <div id="controls-right">
      <div class="action-btns">
        <!-- Pico Park: Space = saltar, Enter = confirmar, E = acción -->
        <div class="btn-action btn-enter"   data-key="Enter"  data-code="13">ENT</div>
        <div class="btn-action btn-jump"    data-key=" "      data-code="32">⬆️</div>
        <div class="btn-action btn-action-e" data-key="e"     data-code="69">E</div>
      </div>
    </div>

  </div>
</div>

<script>
  /* ══════════════════════════════════════════
     TELEGRAM MINI APP
  ══════════════════════════════════════════ */
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.BackButton.show();
    tg.BackButton.onClick(() => {
      if (!document.getElementById('lobby').style.display ||
          document.getElementById('lobby').style.display !== 'none') {
        tg.close();
      } else {
        showLobby();
      }
    });
  }

  // Nombre de usuario de Telegram
  const tgUser = tg?.initDataUnsafe?.user;
  const username = tgUser?.username
    ? '@' + tgUser.username
    : tgUser?.first_name || 'Player';
  document.getElementById('tg-username').textContent = username;

  /* ══════════════════════════════════════════
     LOBBY LOGIC
  ══════════════════════════════════════════ */
  function hostGame() {
    // Abre game.html en el iframe con rol=host y username
    const name = encodeURIComponent(username);
    document.getElementById('game-frame').src =
      `game.html?role=host&name=${name}`;
    showGame();

    // Escuchar el room code que el juego envía via postMessage
    window.addEventListener('message', function onMsg(e) {
      if (e.data?.type === 'roomCode') {
        showToast('ROOM CODE: ' + e.data.code, 5000);
        // Si Telegram está disponible, compartir el código
        if (tg && tg.showPopup) {
          tg.showPopup({
            title: '🎮 Room Created!',
            message: 'Share this code with friends:\n\n' + e.data.code,
            buttons: [{ type: 'close' }]
          });
        }
        window.removeEventListener('message', onMsg);
      }
    });
  }

  function joinGame() {
    const code = document.getElementById('room-code').value.trim().toUpperCase();
    if (!code) {
      showToast('Enter a room code!', 2000);
      return;
    }
    const name = encodeURIComponent(username);
    document.getElementById('game-frame').src =
      `game.html?role=join&code=${code}&name=${name}`;
    showGame();
  }

  function showGame() {
    document.getElementById('lobby').style.display = 'none';
    const gw = document.getElementById('game-wrapper');
    gw.style.display = 'flex';
  }

  function showLobby() {
    document.getElementById('game-frame').src = '';
    document.getElementById('lobby').style.display = 'flex';
    document.getElementById('game-wrapper').style.display = 'none';
  }

  function showToast(msg, ms = 3000) {
    const t = document.getElementById('room-toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', ms);
  }

  /* ══════════════════════════════════════════
     CONTROLES MÓVILES → IFRAME
     (Pico Park es JS puro, no Emscripten,
      así que usamos postMessage al iframe)
  ══════════════════════════════════════════ */
  function fireKeyToFrame(type, keyCode, key) {
    const frame = document.getElementById('game-frame');
    if (frame && frame.contentWindow) {
      // Método 1: postMessage (si el juego lo escucha)
      frame.contentWindow.postMessage({ type, keyCode, key }, '*');
    }

    // Método 2: disparar en el documento padre también
    // (por si el iframe usa document del padre)
    const init = {
      bubbles: true, cancelable: true,
      key: key, keyCode: keyCode, which: keyCode, charCode: 0,
      code: key === ' ' ? 'Space' :
            key === 'Enter' ? 'Enter' :
            key === 'ArrowUp' ? 'ArrowUp' :
            key === 'ArrowDown' ? 'ArrowDown' :
            key === 'ArrowLeft' ? 'ArrowLeft' :
            key === 'ArrowRight' ? 'ArrowRight' : 'Key' + key.toUpperCase()
    };
    const ev = new KeyboardEvent(type, init);
    Object.defineProperty(ev, 'keyCode', { get: () => keyCode });
    Object.defineProperty(ev, 'which',   { get: () => keyCode });
    document.dispatchEvent(ev);
    window.dispatchEvent(ev);

    // Método 3: intentar acceder al iframe directamente (mismo origen)
    try {
      const iDoc = frame.contentDocument || frame.contentWindow?.document;
      if (iDoc) {
        iDoc.dispatchEvent(ev);
        iDoc.body?.dispatchEvent(ev);
        // Forzar en canvas si existe dentro del iframe
        iDoc.querySelectorAll('canvas').forEach(c => c.dispatchEvent(ev));
      }
    } catch(e) { /* cross-origin bloqueado */ }
  }

  document.querySelectorAll('[data-key]').forEach(btn => {
    const key  = btn.dataset.key;
    const code = parseInt(btn.dataset.code);

    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      btn.classList.add('pressed');
      fireKeyToFrame('keydown', code, key);
    }, { passive: false });

    btn.addEventListener('touchend', e => {
      e.preventDefault();
      btn.classList.remove('pressed');
      fireKeyToFrame('keyup', code, key);
    }, { passive: false });

    btn.addEventListener('mousedown', () => {
      btn.classList.add('pressed');
      fireKeyToFrame('keydown', code, key);
    });
    btn.addEventListener('mouseup', () => {
      btn.classList.remove('pressed');
      fireKeyToFrame('keyup', code, key);
    });
  });

  /* ══════════════════════════════════════════
     RESIZE del iframe
  ══════════════════════════════════════════ */
  function resizeFrame() {
    const wrapper = document.getElementById('game-wrapper');
    const controls = document.getElementById('mobile-controls');
    const frame = document.getElementById('game-frame');
    if (!frame || !wrapper) return;

    const isPortrait = window.innerHeight > window.innerWidth;
    if (isPortrait) {
      const availH = wrapper.clientHeight - (controls.offsetHeight || 170);
      frame.style.height = availH + 'px';
      frame.style.width  = '100%';
    } else {
      frame.style.height = '100%';
      frame.style.width  = (wrapper.clientWidth - 300) + 'px'; // 150px cada lado
    }
  }
  window.addEventListener('resize', resizeFrame);
  window.addEventListener('load',   resizeFrame);
  setTimeout(resizeFrame, 300);
</script>

</body>
</html>

<html lang="en">
<head>
<meta charset="UTF-8">

<title id="title">Microscopic Natural Area for Public Recreational Activities</title>
<style>
@font-face {
  font-family: squareforced;
  src: local('FORCEDSQUARE'), url(./assets/FORCEDSQUARE.ttf) format('truetype');
}
body { margin: 0%; overflow: hidden; }
.overlay { position: fixed; top: 0%; left: 0%; z-index: 10; }

/* Cuando corre como iframe (dentro de index.html), ocultamos
   el menú interno porque index.html ya tiene la sala de espera */
body.in-iframe .overlay { display: none !important; }
body.in-iframe #menu    { display: none !important; }
</style>
</head>
<body>

<script>
// ══════════════════════════════════════════
// Parser de URL corregido — soporta flags sin valor (?host)
// El original sólo manejaba key=value, nunca detectaba ?host
// ══════════════════════════════════════════
var urlData = {};
try {
  var _search = location.search.slice(1);
  if (_search) {
    _search.split('&').forEach(function(part) {
      var idx = part.indexOf('=');
      if (idx === -1) {
        urlData[part] = true;           // flag: "host" → urlData.host = true
      } else {
        urlData[part.slice(0, idx)] = decodeURIComponent(part.slice(idx + 1));
      }
    });
  }
} catch(e) {}

// Detectar si estamos dentro de un iframe
var isInIframe = (function() {
  try { return window.self !== window.top; } catch(e) { return true; }
})();

// Si estamos en iframe, agregar clase para ocultar el menú interno
if (isInIframe) {
  document.addEventListener('DOMContentLoaded', function() {
    document.body.classList.add('in-iframe');
  });
}
</script>

<canvas id="c" style="display: none;"></canvas>

<!-- Este overlay y menú se ocultan cuando corre como iframe -->
<div class="overlay">
  <a href="./index.html">Back to Home</a> |
  <a style="display: none;" id="restartLevel" href="#" onClick="(function(){
    mainGame.levelHandler.setLevel(mainGame.levelHandler.currentLevel.name)
    return false;
  })();return false;">Restart Level</a>
</div>

<script src="./src/multiplayer.js"></script>

<div id="menu">
  <br>
  <div id="host" style="display: none;">
    <div id="gameDetails">
      <div id="gameCode">Code: <b id="roomCode">fetching</b><span id="incoming"></span></div>
      <a id="copyLink" href="#" onclick="(function(){
        navigator.clipboard.writeText(`https://aeolus-1.github.io/picoParkClone/game.html?join=${hostConnection.joinConn.selfId}`);
        return false;
      })();return false;">[Copy Link]</a>
    </div>
    <div id="memberList" style="border: solid black 1px; width:200px">
      <h2>Members:</h2>
      <div id="memberlist"></div>
      <div>Host<br></div>
    </div>
    <button onClick="(function(){
      mainGame.playerhandler.addPlayer({
        controls:['a','d','w','s'],
        keys:keys,
        color:mainGame.fetchColor(),
      })
      addPlayerToMenu('Player2')
      return false;
    })();return false;">Add local co-op Player</button>
    <hr>
    <button onClick="(function(){
      startGame()
      hostConnection.broadcast(JSON.stringify({ startGame:true }))
      return false;
    })();return false;">Start Game</button>
  </div>

  <div id="join" style="display: none;">
    Waiting for host to start (maybe idk really)
  </div>
</div>

<script>
window.localfile = location.protocol == "file:"

function initGame() {
  window.mainGame = new Game()
  var player1 = mainGame.playerhandler.addPlayer({
    controls: ["arrowleft","arrowright","arrowup","arrowdown"],
    keys: keys,
  })
  window.hostConnection; window.clientConnection

  if (urlData.host) { hostConnection = new Host(mainGame); hostConnection.init() }
  if (urlData.join) {
    clientConnection = new Client(mainGame, player1)
    clientConnection.init(urlData.join)
    document.getElementById("restartLevel").style.display = "none"
  }
  if (!urlData.host && !urlData.join) startGame()

  setInterval(() => {
    if (window.hostConnection)   hostConnection.updateClients()
    if (window.clientConnection) clientConnection.updateHost()
  }, 10);

  setInterval(() => {
    mainGame.players.forEach((e) => { if (!e.onlinePlayer) e.updateKeys(keys) })
  }, 5);
}

function startMainGame() {
  mainGame.testInit()
  mainGame.initRender()
}

window.onload = () => {
  _loadFont("squareforced")

  // Si es iframe, ocultar menú inmediatamente también por si DOMContentLoaded
  // ya pasó antes de que el script corriera
  if (isInIframe) {
    document.body.classList.add('in-iframe');
  }

  // Solo mostrar los elementos del menú si NO es iframe
  // (cuando se abre game.html directo en el browser, sin index.html)
  if (!isInIframe) {
    if (urlData.host)      document.getElementById("host").style.display = ""
    else if (urlData.join) document.getElementById("join").style.display = ""
  }

  initGame()

  let tempLevel = localStorage.getItem("tempLevel")
  if (tempLevel != null) {
    let levelString = `({${atob(tempLevel)}})`
    document.getElementById("gameCode").innerHTML = "-- temp level loaded --"
    document.getElementById("title").textContent  = "temp-level"
    document.getElementById("copyLink").style.display = "none"
    levels.tempLevel = eval(levelString)["tempName"]
    mainGame.runTemp = true
    localStorage.removeItem("tempLevel")
  }

  // ══════════════════════════════════════════════════════════════
  // Notificar al parent (index.html) cuando PeerJS tenga el ID.
  // Vigilamos #roomCode hasta que deje de decir "fetching".
  // ══════════════════════════════════════════════════════════════
  if (urlData.host) {
    var peerIdSent = false
    var retries    = 0

    var peerInterval = setInterval(function() {
      retries++
      if (retries > 150) { clearInterval(peerInterval); return; } // 45s timeout

      var el = document.getElementById('roomCode')
      if (!el) return

      var text = (el.textContent || el.innerText || '').trim()
      if (text && text !== 'fetching' && !peerIdSent) {
        peerIdSent = true
        clearInterval(peerInterval)

        var msg = { type: 'roomCode', code: text }
        // Notificar al parent (iframe → index.html)
        try { window.parent.postMessage(msg, '*') } catch(e) {}
        try { window.top.postMessage(msg, '*')    } catch(e) {}
        try { if (window.opener) window.opener.postMessage(msg, '*') } catch(e) {}
      }
    }, 300)

    // Observar #memberlist para contar jugadores conectados
    var mlWait = setInterval(function() {
      var ml = document.getElementById('memberlist')
      if (!ml) return
      clearInterval(mlWait)

      new MutationObserver(function() {
        var count = (ml.children ? ml.children.length : 0) + 1 // +1 = el host
        var msg = { type: 'playerJoined', count: count }
        try { window.parent.postMessage(msg, '*') } catch(e) {}
        try { window.top.postMessage(msg, '*')    } catch(e) {}
      }).observe(ml, { childList: true, subtree: true })
    }, 500)
  }
}

function setLevel(lvl) {
  mainGame.renderer.levelTransistion(lvl)
  if (window.hostConnection) {
    hostConnection.broadcast(JSON.stringify({ setLevel: lvl }))
  }
}
</script>
</body>

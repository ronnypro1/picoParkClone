<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta charset="utf-8">
<title>Pico Park</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: #1a1a2e;
  touch-action: none;
  font-family: 'Press Start 2P', monospace;
}

/* ══ LOBBY ══ */
#lobby {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  z-index: 100;
  gap: 20px;
  padding: 20px;
}
#lobby h1 {
  font-size: clamp(10px, 4vw, 18px);
  color: #e94560;
  text-shadow: 0 0 20px #e94560, 2px 2px 0 #7a0000;
  text-align: center;
  line-height: 1.8;
  letter-spacing: 2px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

#tg-user-banner {
  font-size: clamp(7px, 2.5vw, 11px);
  color: #a8dadc;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(168,218,220,0.3);
  border-radius: 8px;
  padding: 8px 16px;
  text-align: center;
}
.lobby-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(8px, 2.8vw, 12px);
  color: #fff;
  background: #e94560;
  border: none; border-radius: 6px;
  padding: 14px 24px; cursor: pointer;
  width: 100%; max-width: 320px;
  text-align: center;
  box-shadow: 0 4px 0 #7a0000;
  transition: transform 0.08s, box-shadow 0.08s;
  -webkit-tap-highlight-color: transparent;
}
.lobby-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a0000; }
.lobby-btn.secondary { background: #0f3460; box-shadow: 0 4px 0 #061a33; }
.lobby-btn.secondary:active { box-shadow: 0 1px 0 #061a33; }
.input-group { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
.input-group label { font-size: clamp(7px, 2.2vw, 9px); color: #a8dadc; }
.input-group input {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(8px, 2.5vw, 10px);
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(168,218,220,0.4);
  border-radius: 6px; color: #fff;
  padding: 12px 10px; width: 100%; outline: none;
}
.input-group input:focus { border-color: #e94560; }
.divider { font-size: clamp(7px, 2vw, 9px); color: rgba(255,255,255,0.3); text-align: center; }
#join-section { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 320px; }

/* ══ SALA DE ESPERA ══ */
#waiting-room {
  display: none;
  position: fixed; inset: 0; z-index: 90;
  flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px; padding: 24px;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
}
#waiting-room h2 {
  color: #e94560; font-size: clamp(9px, 3vw, 14px);
  text-align: center; text-shadow: 0 0 14px #e94560;
}
.spinner-row { display: flex; align-items: center; gap: 12px; }
.spinner {
  width: 28px; height: 28px; flex-shrink: 0;
  border: 3px solid rgba(233,69,96,0.2);
  border-top-color: #e94560;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner-label { font-size: clamp(7px, 2vw, 9px); color: #a8dadc; }
.dots::after {
  content: '';
  animation: dotanim 1.4s steps(4, end) infinite;
}
@keyframes dotanim { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }

.room-code-badge {
  background: rgba(233,69,96,0.12);
  border: 2px solid rgba(233,69,96,0.5);
  border-radius: 10px; padding: 14px 28px; text-align: center;
  width: 100%; max-width: 320px;
}
.room-code-badge .badge-label {
  display: block; font-size: clamp(6px, 1.8vw, 8px);
  color: #a8dadc; margin-bottom: 10px; letter-spacing: 1px;
}
.room-code-badge .badge-code {
  display: block; font-size: clamp(10px, 3vw, 16px);
  color: #e94560; letter-spacing: 4px; word-break: break-all; line-height: 1.6;
}
.waiting-link-row {
  display: flex; gap: 8px;
  width: 100%; max-width: 320px;
}
#waiting-link {
  flex: 1; min-width: 0;
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(5px, 1.4vw, 7px);
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(168,218,220,0.4);
  border-radius: 6px; color: #fff;
  padding: 10px 8px; outline: none;
}
#waiting-copy-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(6px, 1.8vw, 8px);
  background: #e94560; color: #fff; border: none;
  border-radius: 6px; padding: 10px 12px; cursor: pointer;
  white-space: nowrap; box-shadow: 0 3px 0 #7a0000;
  flex-shrink: 0; -webkit-tap-highlight-color: transparent;
}
#waiting-copy-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a0000; }
#waiting-players { font-size: clamp(6px, 2vw, 9px); color: #a8dadc; }
.waiting-hint {
  font-size: clamp(5px, 1.6vw, 7px); color: rgba(255,255,255,0.35);
  text-align: center; max-width: 300px; line-height: 2.2;
}
#btn-enter-game {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(8px, 2.5vw, 11px);
  background: #e94560; color: #fff; border: none;
  border-radius: 6px; padding: 14px 24px; cursor: pointer;
  box-shadow: 0 4px 0 #7a0000;
  width: 100%; max-width: 320px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.08s, box-shadow 0.08s, opacity 0.2s;
  opacity: 0.45; pointer-events: none;
}
#btn-enter-game.ready { opacity: 1; pointer-events: auto; }
#btn-enter-game:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a0000; }
#btn-cancel-host {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(7px, 2vw, 9px);
  background: transparent; color: rgba(255,255,255,0.4);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
  padding: 10px 20px; cursor: pointer; margin-top: -4px;
  width: 100%; max-width: 320px; -webkit-tap-highlight-color: transparent;
}

/* ══ GAME WRAPPER ══ */
#game-wrapper {
  position: fixed; inset: 0;
  display: none;
}
@media (orientation: portrait) {
  #game-wrapper { flex-direction: column; background: #111; }
  #canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #mobile-controls {
    height: 170px; flex-shrink: 0; display: flex; flex-direction: row;
    align-items: center; justify-content: space-between;
    padding: 10px 24px; gap: 12px;
    background: rgba(0,0,0,0.8);
    border-top: 1px solid rgba(233,69,96,0.3);
  }
  #controls-left, #controls-right { display: flex; align-items: center; justify-content: center; }
}
@media (orientation: landscape) {
  #game-wrapper { flex-direction: row; background: #111; }
  #canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #mobile-controls { display: contents; }
  #controls-left {
    width: 150px; flex-shrink: 0; order: -1;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.8); border-right: 1px solid rgba(233,69,96,0.3);
  }
  #controls-right {
    width: 150px; flex-shrink: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(0,0,0,0.8); border-left: 1px solid rgba(233,69,96,0.3);
  }
}
#game-frame { width: 100%; height: 100%; border: none; display: block; }

/* ══ CONTROLES ══ */
.dpad { position: relative; width: 130px; height: 130px; flex-shrink: 0; }
.btn-d {
  position: absolute; width: 44px; height: 44px;
  background: rgba(233,69,96,0.2); border: 2px solid rgba(233,69,96,0.6);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #fff; cursor: pointer;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.btn-d:active, .btn-d.pressed { background: rgba(233,69,96,0.7); }
.btn-left{left:0;top:43px} .btn-right{left:86px;top:43px}
.btn-up{left:43px;top:0}   .btn-down{left:43px;top:86px}
.action-btns { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
.btn-action {
  width: 60px; height: 60px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.5);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #fff; flex-shrink: 0; user-select: none;
  font-family: 'Press Start 2P', monospace;
  -webkit-tap-highlight-color: transparent;
}
.btn-action:active, .btn-action.pressed { filter: brightness(1.5); }
.btn-jump  { background: rgba(233,69,96,0.55); font-size: 20px; }
.btn-enter { background: rgba(0,180,100,0.55); font-size: 8px; }
.btn-action-e { background: rgba(50,120,255,0.55); font-size: 8px; }

/* ══ TOAST ══ */
#room-toast {
  display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(233,69,96,0.95); color: #fff;
  font-family: 'Press Start 2P', monospace; font-size: 8px;
  padding: 10px 18px; border-radius: 8px; z-index: 300; text-align: center; white-space: nowrap;
}
</style>
</head>
<body>

<!-- ══ LOBBY ══ -->
<div id="lobby">
  <h1>🐱 PICO PARK<br>CLONE</h1>
  <div id="tg-user-banner">👤 <span id="tg-username">Player</span></div>
  <button class="lobby-btn" onclick="hostGame()">🎮 HOST GAME</button>
  <div class="divider">── OR ──</div>
  <div id="join-section">
    <div class="input-group">
      <label>PEER ID / CÓDIGO</label>
      <input type="text" id="room-code" placeholder="Pega el peer ID aquí"
        autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <button class="lobby-btn secondary" onclick="joinGame()">🔗 JOIN ROOM</button>
  </div>
</div>

<!-- ══ SALA DE ESPERA ══ -->
<div id="waiting-room">
  <h2>🎮 SALA CREADA</h2>

  <div class="spinner-row" id="spinner-row">
    <div class="spinner"></div>
    <span class="spinner-label">Conectando con PeerJS<span class="dots"></span></span>
  </div>

  <div class="room-code-badge">
    <span class="badge-label">ROOM CODE (PEER ID)</span>
    <span class="badge-code" id="waiting-code">—</span>
  </div>

  <div class="waiting-link-row">
    <input id="waiting-link" type="text" readonly placeholder="link aparecerá aquí...">
    <button id="waiting-copy-btn" onclick="copyRoomLink()">📋 COPIAR</button>
  </div>

  <p id="waiting-players">Esperando jugadores<span class="dots"></span></p>
  <p class="waiting-hint">Cuando todos estén listos,<br>presiona IR AL JUEGO → Start Game</p>

  <button id="btn-enter-game" onclick="enterGame()">▶ IR AL JUEGO</button>
  <button id="btn-cancel-host" onclick="cancelHost()">✖ CANCELAR</button>
</div>

<!-- ══ TOAST ══ -->
<div id="room-toast"></div>

<!-- ══ JUEGO ══ -->
<div id="game-wrapper">
  <div id="canvas-area">
    <!-- allow="clipboard-write" necesario para que PeerJS funcione bien en algunos browsers -->
    <iframe id="game-frame" src=""
      allow="autoplay; clipboard-write"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
      allowfullscreen></iframe>
  </div>
  <div id="mobile-controls">
    <div id="controls-left">
      <div class="dpad">
        <div class="btn-d btn-up"     data-key="ArrowUp"    data-code="38">↑</div>
        <div class="btn-d btn-left"   data-key="ArrowLeft"  data-code="37">←</div>
        <div class="btn-d btn-right"  data-key="ArrowRight" data-code="39">→</div>
        <div class="btn-d btn-down"   data-key="ArrowDown"  data-code="40">↓</div>
      </div>
    </div>
    <div id="controls-right">
      <div class="action-btns">
        <div class="btn-action btn-enter"    data-key="Enter" data-code="13">ENT</div>
        <div class="btn-action btn-jump"     data-key=" "     data-code="32">⬆️</div>
        <div class="btn-action btn-action-e" data-key="e"     data-code="69">E</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ══ TELEGRAM ══ */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.BackButton.show();
  tg.BackButton.onClick(() => {
    if (document.getElementById('game-wrapper').style.display !== 'none') showLobby();
    else if (document.getElementById('waiting-room').style.display !== 'none') cancelHost();
    else tg.close();
  });
}
const tgUser   = tg?.initDataUnsafe?.user;
const username = tgUser?.username ? '@'+tgUser.username : (tgUser?.first_name || 'Player');
document.getElementById('tg-username').textContent = username;

let currentPeerId = null;

/* ══ HOST ══ */
function hostGame() {
  currentPeerId = null;

  // Mostrar sala de espera
  document.getElementById('lobby').style.display        = 'none';
  document.getElementById('waiting-room').style.display = 'flex';

  // Reset UI sala
  document.getElementById('waiting-code').textContent  = '—';
  document.getElementById('waiting-link').value        = '';
  document.getElementById('btn-enter-game').classList.remove('ready');
  document.getElementById('spinner-row').style.display = 'flex';
  document.getElementById('waiting-players').innerHTML = 'Esperando jugadores<span class="dots"></span>';

  // Cargar game.html?host en el iframe pero con el game-wrapper INVISIBLE
  // PeerJS necesita correr en el DOM para generar el ID, pero no queremos
  // que tape la sala de espera
  const gw = document.getElementById('game-wrapper');
  gw.style.display    = 'flex';        // necesario para que el iframe exista en el DOM
  gw.style.visibility = 'hidden';      // pero invisible
  gw.style.pointerEvents = 'none';     // y sin interacción

  const frame = document.getElementById('game-frame');
  frame.src = 'game.html?host';

  window.addEventListener('message', onGameMessage);
}

function onGameMessage(e) {
  if (!e.data || typeof e.data !== 'object') return;

  if (e.data.type === 'roomCode' && e.data.code) {
    currentPeerId = e.data.code;

    // Ocultar spinner
    document.getElementById('spinner-row').style.display = 'none';

    // Mostrar código
    document.getElementById('waiting-code').textContent = currentPeerId;

    // Armar link
    const base = location.href.replace(/[?#].*$/, '');
    const link = base + '?join=' + currentPeerId;
    document.getElementById('waiting-link').value = link;

    // Habilitar botón
    document.getElementById('btn-enter-game').classList.add('ready');

    // Popup Telegram
    if (tg && tg.showPopup) {
      tg.showPopup({
        title: '🎮 Sala lista!',
        message: 'Peer ID:\n' + currentPeerId + '\n\nComparte el link con tus amigos!',
        buttons: [{ type: 'close', text: 'OK' }]
      });
    }
  }

  if (e.data.type === 'playerJoined') {
    document.getElementById('waiting-players').textContent =
      (e.data.count || '?') + ' jugador(es) en sala ✓';
  }
}

function enterGame() {
  if (!currentPeerId) { showToast('⏳ Espera el código...', 2000); return; }

  // Hacer el juego visible
  const gw = document.getElementById('game-wrapper');
  gw.style.visibility  = 'visible';
  gw.style.pointerEvents = 'auto';

  document.getElementById('waiting-room').style.display = 'none';
  window.removeEventListener('message', onGameMessage);
  resizeFrame();
}

function cancelHost() {
  window.removeEventListener('message', onGameMessage);
  document.getElementById('game-frame').src = '';
  const gw = document.getElementById('game-wrapper');
  gw.style.display       = 'none';
  gw.style.visibility    = 'visible';
  gw.style.pointerEvents = 'auto';
  document.getElementById('waiting-room').style.display = 'none';
  document.getElementById('lobby').style.display        = 'flex';
  currentPeerId = null;
}

function copyRoomLink() {
  const link = document.getElementById('waiting-link').value;
  const btn  = document.getElementById('waiting-copy-btn');
  if (!link || link === '') { showToast('⏳ Todavía generando...', 2000); return; }

  const ok = () => {
    btn.textContent = '✅ COPIADO!';
    setTimeout(() => btn.textContent = '📋 COPIAR', 2500);
    showToast('Link copiado! 🎉', 2000);
  };

  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(link).then(ok).catch(() => fallbackCopy(link, ok));
  } else {
    fallbackCopy(link, ok);
  }
}

function fallbackCopy(text, cb) {
  try {
    const tmp = document.createElement('textarea');
    tmp.value = text; tmp.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(tmp); tmp.focus(); tmp.select();
    document.execCommand('copy');
    document.body.removeChild(tmp); cb();
  } catch(e) { showToast('Copia: ' + text, 6000); }
}

/* ══ JOIN ══ */
function joinGame() {
  let raw = document.getElementById('room-code').value.trim();
  if (!raw) { showToast('Ingresa un código!', 2000); return; }

  let peerId = raw;
  const m = raw.match(/[?&]join=([^&#]+)/);
  if (m) peerId = m[1];

  document.getElementById('lobby').style.display        = 'none';
  document.getElementById('waiting-room').style.display = 'none';

  const gw = document.getElementById('game-wrapper');
  gw.style.display       = 'flex';
  gw.style.visibility    = 'visible';
  gw.style.pointerEvents = 'auto';

  document.getElementById('game-frame').src = 'game.html?join=' + peerId;
  resizeFrame();
}

function showLobby() {
  window.removeEventListener('message', onGameMessage);
  document.getElementById('game-frame').src = '';
  const gw = document.getElementById('game-wrapper');
  gw.style.display       = 'none';
  gw.style.visibility    = 'visible';
  gw.style.pointerEvents = 'auto';
  document.getElementById('waiting-room').style.display = 'none';
  document.getElementById('lobby').style.display        = 'flex';
  currentPeerId = null;
}

function showToast(msg, ms = 3000) {
  const t = document.getElementById('room-toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', ms);
}

/* ══ CONTROLES MÓVILES ══ */
function fireKeyToFrame(type, keyCode, key) {
  const frame = document.getElementById('game-frame');
  if (frame?.contentWindow) {
    frame.contentWindow.postMessage({ type, keyCode, key }, '*');
  }
  const code = key === ' ' ? 'Space' : key === 'Enter' ? 'Enter'
             : key.startsWith('Arrow') ? key : 'Key' + key.toUpperCase();
  const ev = new KeyboardEvent(type, { bubbles:true, cancelable:true, key, keyCode, which:keyCode, charCode:0, code });
  Object.defineProperty(ev, 'keyCode', { get: () => keyCode });
  Object.defineProperty(ev, 'which',   { get: () => keyCode });
  [document, window].forEach(t => t.dispatchEvent(ev));
  try {
    const iDoc = frame?.contentDocument || frame?.contentWindow?.document;
    if (iDoc) {
      iDoc.dispatchEvent(ev); iDoc.body?.dispatchEvent(ev);
      iDoc.querySelectorAll('canvas').forEach(c => c.dispatchEvent(ev));
    }
  } catch(e) {}
}

document.querySelectorAll('[data-key]').forEach(btn => {
  const key = btn.dataset.key, code = parseInt(btn.dataset.code);
  btn.addEventListener('touchstart', e => { e.preventDefault(); btn.classList.add('pressed'); fireKeyToFrame('keydown', code, key); }, {passive:false});
  btn.addEventListener('touchend',   e => { e.preventDefault(); btn.classList.remove('pressed'); fireKeyToFrame('keyup', code, key); }, {passive:false});
  btn.addEventListener('mousedown',  () => { btn.classList.add('pressed'); fireKeyToFrame('keydown', code, key); });
  btn.addEventListener('mouseup',    () => { btn.classList.remove('pressed'); fireKeyToFrame('keyup', code, key); });
});

/* ══ RESIZE ══ */
function resizeFrame() {
  const wrapper  = document.getElementById('game-wrapper');
  const controls = document.getElementById('mobile-controls');
  const frame    = document.getElementById('game-frame');
  if (!frame || !wrapper) return;
  if (window.innerHeight > window.innerWidth) {
    frame.style.height = (wrapper.clientHeight - (controls.offsetHeight || 170)) + 'px';
    frame.style.width  = '100%';
  } else {
    frame.style.height = '100%';
    frame.style.width  = (wrapper.clientWidth - 300) + 'px';
  }
}
window.addEventListener('resize', resizeFrame);
window.addEventListener('load',   resizeFrame);
setTimeout(resizeFrame, 300);

/* ══ AUTO JOIN desde URL directa ══ */
(function() {
  const joinId = new URLSearchParams(location.search).get('join');
  if (joinId) { document.getElementById('room-code').value = joinId; setTimeout(joinGame, 400); }
})();
</script>
</body>
</html>
